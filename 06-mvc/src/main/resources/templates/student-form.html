<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
<h3>Student Registration Form</h3>

<form th:action="@{/processStudentForm}" th:object="${student}" method="POST">

    <div>
        <label for="firstName">First name:</label>
        <input type="text" id="firstName" th:field="*{firstName}">
    </div>

    <div>
        <label for="lastName">Last name:</label>
        <input type="text" id="lastName" th:field="*{lastName}">
    </div>

    <div>
        <label for="country">Country:</label>
        <select id="country" th:field="*{country}">
            <option value="" disabled selected>Select a country</option>
            <option th:each="tempCountry : ${countries}"
                    th:value="${tempCountry}"
                    th:text="${tempCountry}">
            </option>
        </select>
    </div>
    <div>
        <p>Favorite Programming Language:</p>
        <label>
            <input type="radio" th:field="*{favouriteLanguage}"
                   th:each="tempLanguage : ${languages}"
                   th:value="${tempLanguage}"
                   th:text="${tempLanguage}">
        </label>
    </div>
    <div>
        <p>Favourite OS:</p>
        <label>
            <input type="checkbox" th:field="*{favouriteSystems}"
                   th:each="tempSystem : ${systems}"
                   th:value="${tempSystem}"
                   th:text="${tempSystem}">
        </label>
    </div>

    <div>
        <button type="submit">Submit</button>
    </div>

</form>
</body>
</html>
