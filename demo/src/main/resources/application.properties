spring.application.name=demo

# Use wildcard "*" to expose all endpoints
# Can also expose individual endpoints with a comma-delimited list
management.endpoints.web.exposure.include=*
# management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Exclude individual endpoints with a comma-delimited list
# management.endpoints.web.exposure.exclude=health,info

# Overrides default username and generated password in console
spring.security.user.name=viki
spring.security.user.password=deni

info.app.name=demo
info.app.description=A demo app
info.app.version=1.0.0

# Define my custom properties
coach.name=Stefan
team.name=Scammers

# Change SpringBoot embedded server port (default: 8080)
server.port=7777

# Set the context-path of the app (default : "/")
server.servlet.context-path=/demo

# Set session timeout (default:30 minutes)
server.servlet.session.timeout=5m
